<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rehaab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
<style>
:root{--bg:#000;--card:#111;--card2:#1a1a1a;--border:#222;--text:#fff;--muted:#555;--sub:#888;--accent:#E8FF47;--red:#ff453a;--green:#30d158;--orange:#ff9f0a;--radius:20px;--radius-sm:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:5rem}

.header{padding:3rem 1.5rem 1.25rem;background:var(--bg);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border)}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem}
.title{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;letter-spacing:-1px;line-height:1}
.title span{color:var(--accent)}
.phase-pill{background:var(--card2);border:1px solid var(--border);border-radius:100px;padding:.4rem 1rem;font-size:.75rem;font-weight:600;color:var(--sub)}
.phase-pill.p2{background:var(--accent);color:#000;border-color:var(--accent)}
.week-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.week-row::-webkit-scrollbar{display:none}
.week-btn{flex-shrink:0;width:44px;height:44px;background:var(--card);border:1px solid var(--border);color:var(--sub);border-radius:12px;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Syne',sans-serif;position:relative}
.week-btn.active{background:var(--accent);color:#000;border-color:var(--accent);transform:scale(1.05);box-shadow:0 6px 20px rgba(232,255,71,.3)}
.week-btn.locked{opacity:.45}
.week-btn .lock{position:absolute;top:-4px;right:-4px;font-size:.7rem}

.section{padding:1.5rem 1.5rem 0}
.section-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:1rem}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem}
.stat-card-label{font-size:.8rem;color:var(--sub);font-weight:500;margin-bottom:.5rem}
.stat-card-value{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;letter-spacing:-1.5px}
.stat-card-value span{font-size:1rem;color:var(--sub);font-weight:500;margin-left:2px;letter-spacing:0}
.stat-card-sub{font-size:.75rem;color:var(--muted);margin-top:.25rem}

.banner{background:linear-gradient(135deg,rgba(232,255,71,.12),rgba(232,255,71,.02));border:1px solid rgba(232,255,71,.3);border-radius:var(--radius);padding:1.1rem 1.25rem;display:flex;align-items:center;gap:1rem;cursor:pointer}
.banner.warn{background:linear-gradient(135deg,rgba(255,159,10,.12),rgba(255,159,10,.02));border-color:rgba(255,159,10,.35)}
.banner-ic{font-size:1.5rem}
.banner-main{flex:1}
.banner-t{font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;margin-bottom:.15rem}
.banner-s{font-size:.78rem;color:var(--sub);line-height:1.4}

/* CALENDAR */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.cal-title{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700}
.cal-nav{display:flex;gap:8px}
.cal-nav-btn{width:32px;height:32px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--sub);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.cal-nav-btn:active{transform:scale(.9)}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-day-label{text-align:center;font-size:.6rem;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-cell{aspect-ratio:1;background:transparent;border:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default;position:relative;transition:all .2s}
.cal-cell.today{background:var(--card2);border:1px solid var(--accent)}
.cal-cell-num{font-size:.8rem;font-weight:600;color:var(--sub)}
.cal-cell.today .cal-cell-num{color:var(--accent)}
.cal-cell.empty .cal-cell-num{color:var(--border)}
.cal-dots{display:flex;gap:3px;margin-top:3px;position:absolute;bottom:4px}
.cal-dot{width:5px;height:5px;border-radius:50%}
.cal-dot.A{background:#ff453a}
.cal-dot.B{background:#E8FF47}
.cal-dot.C{background:#30d158}
.cal-dot.D{background:#5ac8fa}

/* CHART */
.chart-container{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-top:10px}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:100px;padding-top:.5rem}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.chart-bar{width:100%;border-radius:6px 6px 0 0;background:var(--accent);transition:height .4s ease;min-height:2px;margin-top:auto}
.chart-bar.empty{background:var(--card2)}
.chart-bar-label{font-size:.6rem;color:var(--muted);font-weight:600}
.chart-bar-val{font-size:.7rem;color:var(--accent);font-weight:700}

.session-list{display:flex;flex-direction:column;gap:10px}
.session-row{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;display:flex;align-items:center;gap:1.25rem;cursor:pointer;transition:all .2s}
.session-row:active{transform:scale(.98);background:var(--card2)}
.s-num{width:44px;height:44px;background:var(--card2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;flex-shrink:0}
.s-num.A{background:rgba(255,69,58,.2);color:#ff453a}
.s-num.B{background:rgba(232,255,71,.15);color:var(--accent)}
.s-num.C{background:rgba(48,209,88,.2);color:#30d158}
.s-num.D{background:rgba(90,200,250,.2);color:#5ac8fa}
.s-info{flex:1}
.s-name{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:700;margin-bottom:.2rem}
.s-day{font-size:.8rem;color:var(--sub)}
.s-arrow{color:var(--muted);font-size:1.4rem}
.s-check{color:var(--green);font-size:1.3rem;font-weight:700}
.s-meta{font-size:.72rem;color:var(--accent);font-weight:700;margin-top:.15rem}

/* LOG */
.log-row{display:flex;align-items:center;gap:1rem;padding:.75rem 0;border-bottom:1px solid var(--border)}
.log-row:last-child{border-bottom:none}
.log-date{font-size:.85rem;color:var(--sub);font-weight:500;width:90px;flex-shrink:0}
.log-badge{padding:.3rem .7rem;border-radius:8px;font-size:.75rem;font-weight:700}
.log-badge.A{background:rgba(255,69,58,.2);color:#ff453a}
.log-badge.B{background:rgba(232,255,71,.15);color:var(--accent)}
.log-badge.C{background:rgba(48,209,88,.2);color:#30d158}
.log-badge.D{background:rgba(90,200,250,.18);color:#5ac8fa}

.workout-view{animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.topbar{padding:1.5rem 1.5rem 0;display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
.back-btn{width:40px;height:40px;background:var(--card);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;flex-shrink:0;transition:all .2s;color:var(--text)}
.back-btn:active{transform:scale(.9)}
.topbar-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem}
.topbar-sub{font-size:.8rem;color:var(--sub)}

.workout-hero{background:var(--card);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:1.5rem;margin-bottom:1.5rem;position:relative;overflow:hidden}
.workout-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent)}
.hero-title{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;letter-spacing:-1px;margin-bottom:.3rem}
.hero-sub{color:var(--sub);font-size:.9rem;font-weight:500;margin-bottom:1rem}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap}
.hero-tag{background:var(--card2);border:1px solid var(--border);border-radius:100px;padding:.35rem .85rem;font-size:.75rem;font-weight:600;color:var(--sub)}
.prog-wrap{background:var(--card2);border-radius:100px;height:4px;overflow:hidden;margin-top:1rem}
.prog-fill{height:100%;background:var(--accent);border-radius:100px;transition:width .6s ease}
.progbox{background:var(--card2);border-radius:14px;padding:1rem;margin-top:1rem}
.progbox-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.progbox-tag{font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem;color:var(--accent)}
.progbox-rpe{font-size:.7rem;font-weight:700;color:var(--sub);background:var(--card);border:1px solid var(--border);border-radius:100px;padding:.25rem .6rem}
.progbox-focus{font-size:.82rem;color:var(--sub);line-height:1.45}
.progbox-hint{font-size:.74rem;color:var(--accent);margin-top:.55rem;font-weight:600;line-height:1.4}
.zone-chip{display:inline-block;font-size:.64rem;font-weight:700;border-radius:100px;padding:.18rem .55rem;margin-top:.4rem}
.zone-chip.push{background:rgba(48,209,88,.15);color:var(--green)}
.zone-chip.control{background:rgba(255,159,10,.15);color:var(--orange)}
.wk-intent{display:flex;align-items:center;gap:.85rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem}
.wk-intent .ic{font-size:1.4rem;flex-shrink:0}
.wk-intent .t{font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem}
.wk-intent .t span{color:var(--accent)}
.wk-intent .s{font-size:.76rem;color:var(--sub);margin-top:.1rem;line-height:1.4}

.ex-section{padding:0 1.5rem}
.ex-sec-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:1rem;padding-left:.25rem;margin-top:1.5rem;display:flex;align-items:center;gap:.5rem}
.ex-sec-label:first-child{margin-top:0}
.ss-group{border:1px dashed var(--border);border-radius:var(--radius);padding:.75rem;margin-bottom:14px;background:rgba(255,255,255,.01)}
.ss-head{display:flex;align-items:center;justify-content:space-between;padding:.15rem .5rem .65rem}
.ss-name{font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem;color:var(--accent)}
.ss-info{font-size:.7rem;color:var(--sub);font-weight:600}
.ex-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;transition:border-color .3s}
.ex-card:last-child{margin-bottom:0}
.ex-card.done{border-color:var(--green)}
.ex-card.expanded{border-color:var(--accent)}
.ex-row{display:flex;align-items:center;gap:1rem;padding:1.1rem 1.25rem;cursor:pointer}
.check{width:32px;height:32px;flex-shrink:0;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .25s;font-size:1rem}
.ex-card.done .check{background:var(--green);border-color:var(--green);color:#000;font-weight:700}
.ex-main{flex:1;min-width:0}
.ex-name{font-weight:600;font-size:.97rem;line-height:1.3;margin-bottom:.25rem}
.ex-vol{font-size:.8rem;color:var(--accent);font-weight:700}
.ex-chev{color:var(--muted);font-size:1rem;transition:transform .3s;flex-shrink:0}
.ex-card.expanded .ex-chev{transform:rotate(180deg)}
.ex-details{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1);border-top:1px solid transparent}
.ex-card.expanded .ex-details{max-height:1400px;border-top-color:var(--border)}
.ex-body{padding:1.25rem;display:flex;flex-direction:column;gap:1rem}
.ex-desc{font-size:.88rem;color:var(--sub);line-height:1.6}
.variant-box{background:var(--card2);border-left:3px solid var(--orange);border-radius:12px;padding:1rem}
.variant-tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--orange);margin-bottom:.4rem}
.variant-text{font-size:.85rem;color:var(--sub);line-height:1.5}
.swap-btn{display:flex;align-items:center;justify-content:center;gap:.5rem;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:.8rem;color:var(--text);font-weight:600;font-size:.85rem;cursor:pointer;transition:all .2s}
.swap-btn:active{background:var(--border);transform:scale(.98)}

.timer-box{background:var(--card2);border-radius:var(--radius-sm);padding:1.25rem;text-align:center}
.timer-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:.75rem}
.timer-digits{font-family:'Syne',sans-serif;font-size:3.5rem;font-weight:800;letter-spacing:-2px;margin-bottom:1rem;transition:color .3s}
.timer-digits.running{color:var(--accent)}
.timer-digits.done{color:var(--green)}
.timer-btns{display:flex;gap:8px}
.t-btn{flex:1;background:var(--border);border:none;color:var(--text);padding:.85rem;border-radius:12px;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.t-btn.go{background:var(--accent);color:#000}
.t-btn:active{transform:scale(.95);opacity:.8}

.weight-box{background:var(--card2);border-radius:var(--radius-sm);padding:1.25rem}
.w-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:.75rem}
.w-row{display:flex;align-items:center;gap:8px}
.w-input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:.9rem 1rem;border-radius:12px;font-size:1.2rem;font-weight:700;font-family:'Syne',sans-serif;transition:border-color .2s}
.w-input:focus{outline:none;border-color:var(--accent)}
.w-unit{font-size:.9rem;color:var(--sub);font-weight:600}
.reco{display:flex;align-items:center;gap:.5rem;margin-top:.75rem;background:rgba(232,255,71,.08);border:1px solid rgba(232,255,71,.25);border-radius:10px;padding:.6rem .8rem;cursor:pointer}
.reco-t{flex:1;font-size:.8rem;color:var(--accent);font-weight:700}
.reco-apply{font-size:.72rem;background:var(--accent);color:#000;border:none;border-radius:8px;padding:.35rem .7rem;font-weight:700;cursor:pointer}
.w-history{display:flex;gap:6px;margin-top:.75rem;flex-wrap:wrap}
.w-badge{background:var(--card);border:1px solid var(--border);padding:.3rem .6rem;border-radius:8px;font-size:.75rem;font-weight:600;color:var(--sub)}
.w-badge.cur{border-color:var(--accent);color:var(--accent)}

.video-btn{display:flex;align-items:center;justify-content:center;gap:.5rem;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:.9rem;text-decoration:none;color:var(--text);font-weight:600;font-size:.9rem;transition:all .2s}
.video-btn:active{background:var(--border);transform:scale(.98)}

.recov-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:.75rem}
.recov-name{font-weight:600;font-size:.95rem;margin-bottom:.35rem}
.recov-desc{font-size:.85rem;color:var(--sub);line-height:1.5}
.recov-vol{font-size:.8rem;color:var(--accent);font-weight:700;margin-top:.35rem}

.bilan-test{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem}
.bilan-test-name{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:700;margin-bottom:.5rem}
.bilan-test-desc{font-size:.85rem;color:var(--sub);line-height:1.5;margin-bottom:1rem}
.pain-scale{display:flex;gap:4px;flex-wrap:wrap}
.pain-btn{width:36px;height:36px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--sub);font-weight:700;font-size:.85rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.pain-btn.sel-green{background:var(--green);border-color:var(--green);color:#000}
.pain-btn.sel-orange{background:var(--orange);border-color:var(--orange);color:#000}
.pain-btn.sel-red{background:var(--red);border-color:var(--red);color:#fff}
.bilan-result{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-top:1rem;text-align:center}
.bilan-zone{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;margin-bottom:.5rem}

/* MENSURATIONS */
.meas-form{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1.25rem}
.meas-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.meas-field{display:flex;flex-direction:column;gap:.4rem}
.meas-flabel{font-size:.72rem;color:var(--sub);font-weight:600}
.meas-input{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:.8rem .9rem;border-radius:12px;font-size:1.1rem;font-weight:700;font-family:'Syne',sans-serif}
.meas-input:focus{outline:none;border-color:var(--accent)}
.meas-save{width:100%;background:var(--accent);color:#000;border:none;border-radius:12px;padding:.95rem;font-size:.95rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.meas-save:active{transform:scale(.98)}
.spark{width:100%;height:90px;margin-top:.5rem}
.meas-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.meas-stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem}
.meas-stat-l{font-size:.72rem;color:var(--sub);font-weight:600;margin-bottom:.4rem}
.meas-stat-v{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;letter-spacing:-1px}
.meas-stat-v span{font-size:.85rem;color:var(--sub);font-weight:500}
.meas-delta{font-size:.72rem;font-weight:700;margin-top:.25rem}
.meas-delta.down{color:var(--green)}
.meas-delta.up{color:var(--orange)}
.meas-hist-row{display:flex;align-items:center;gap:.75rem;padding:.7rem 0;border-bottom:1px solid var(--border);font-size:.82rem}
.meas-hist-row:last-child{border-bottom:none}
.meas-hist-date{color:var(--sub);width:70px;flex-shrink:0;font-weight:600}
.meas-hist-vals{display:flex;gap:10px;flex-wrap:wrap;color:var(--sub)}
.meas-hist-vals b{color:var(--text)}

/* CHECKPOINT */
.cp-req{display:flex;align-items:center;gap:.85rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1rem 1.1rem;margin-bottom:.65rem}
.cp-req .dot{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.cp-req.ok .dot{background:var(--green);color:#000}
.cp-req.ko .dot{background:var(--card2);border:2px solid var(--border);color:var(--muted)}
.cp-req-main{flex:1}
.cp-req-t{font-weight:600;font-size:.9rem}
.cp-req-s{font-size:.75rem;color:var(--sub);margin-top:.15rem}
.cp-unlock{width:100%;border:none;border-radius:14px;padding:1.1rem;font-size:1rem;font-weight:800;font-family:'Syne',sans-serif;cursor:pointer;margin-top:1rem;transition:all .2s}
.cp-unlock.ready{background:var(--accent);color:#000}
.cp-unlock.notready{background:var(--card2);color:var(--muted);cursor:not-allowed}
.q-row{margin-bottom:1rem}
.q-label{font-size:.88rem;font-weight:600;margin-bottom:.6rem}
.q-opts{display:flex;gap:6px}
.q-opt{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:.6rem;font-size:.78rem;font-weight:600;color:var(--sub);cursor:pointer;text-align:center;transition:all .2s}
.q-opt.sel{background:var(--accent);color:#000;border-color:var(--accent)}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding:.5rem 0 env(safe-area-inset-bottom,.5rem)}

// ── AUDIO ──
function playBeep(){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[0,.15,.3].forEach(d=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;o.type='square';g.gain.value=.15;o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.1)});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,120,200]);}catch(e){}
}

const weekInBloc=w=>((w-1)%4)+1;

const isPushZone=(name,week)=>{ const n=(name||'').toLowerCase(); if(week<=4)return !CONTROL_KEYS.some(k=>n.includes(k)); if(week<=6)return !JUMP_KEYS.some(k=>n.includes(k)); return true; };

// ── GLOBAL TIMERS ──
function useGlobalTimers(){
  const timers=useRef({});const intervals=useRef({});const[tick,setTick]=useState(0);const bump=()=>setTick(t=>t+1);
  const get=(id,def)=>timers.current[id]!==undefined?timers.current[id]:def;
  const isRunning=id=>!!intervals.current[id];
  const start=(id,sec)=>{
    if(isRunning(id)){clearInterval(intervals.current[id]);delete intervals.current[id];bump();return;}
    if(get(id,sec)===0){timers.current[id]=sec;bump();return;}
    if(timers.current[id]===undefined)timers.current[id]=sec;
    intervals.current[id]=setInterval(()=>{timers.current[id]--;if(timers.current[id]<=0){timers.current[id]=0;clearInterval(intervals.current[id]);delete intervals.current[id];playBeep();}bump();},1000);bump();
  };
  const reset=(id,sec)=>{if(intervals.current[id]){clearInterval(intervals.current[id]);delete intervals.current[id];}timers.current[id]=sec;bump();};
  const firstRunning=()=>{const id=Object.keys(intervals.current)[0];return id?{id,t:timers.current[id]}:null;};
  useEffect(()=>()=>{Object.values(intervals.current).forEach(clearInterval)},[]);
  return{get,isRunning,start,reset,firstRunning};
}

function Timer({id,seconds,T,label}){
  const t=T.get(id,seconds);const on=T.isRunning(id);const done=t===0;
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  return(<div className="timer-box"><div className="timer-label">{label||'⏱ Repos (entre supersets)'}</div>
    <div className={`timer-digits${on?' running':done?' done':''}`}>{fmt(t)}</div>
    <div className="timer-btns"><button className="t-btn go" onClick={()=>T.start(id,seconds)}>{done?'🔄 Relancer':on?'⏸ Pause':'▶ Départ'}</button><button className="t-btn" onClick={()=>T.reset(id,seconds)}>Reset</button></div></div>);
}

function Sparkline({points,color}){
  if(!points||points.length<2)return <div style={{fontSize:'.78rem',color:'var(--muted)',padding:'1rem 0'}}>Ajoute au moins 2 mesures pour voir la courbe.</div>;
  const W=300,H=80,pad=6;
  const xs=points.map((p,i)=>pad+i*((W-2*pad)/(points.length-1)));
  const min=Math.min(...points.map(p=>p.v)),max=Math.max(...points.map(p=>p.v));
  const rng=max-min||1;
  const ys=points.map(p=>H-pad-((p.v-min)/rng)*(H-2*pad));
  const d=xs.map((x,i)=>`${i?'L':'M'}${x.toFixed(1)} ${ys[i].toFixed(1)}`).join(' ');
  return(<svg className="spark" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
    <path d={d} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
    {xs.map((x,i)=><circle key={i} cx={x} cy={ys[i]} r="3" fill={color}/>)}
  </svg>);
}

function Calendar({log}){
  const[offset,setOffset]=useState(0);
  const now=new Date();const y=now.getFullYear();const m=now.getMonth()+offset;
  const viewDate=new Date(y,m,1);const viewYear=viewDate.getFullYear();const viewMonth=viewDate.getMonth();
  const daysInMonth=new Date(viewYear,viewMonth+1,0).getDate();
  let firstDay=(new Date(viewYear,viewMonth,1).getDay()+6)%7;
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push({num:null});
  for(let d=1;d<=daysInMonth;d++)cells.push({num:d});
  const today=now.getDate();const isCurrentMonth=offset===0;
  const getDotsForDay=d=>{
    const key=`${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    return(log[key]||[]);
  };
  return(<div>
    <div className="cal-header"><div className="cal-title">{MONTHS[viewMonth]} {viewYear}</div>
      <div className="cal-nav"><button className="cal-nav-btn" onClick={()=>setOffset(o=>o-1)}>‹</button><button className="cal-nav-btn" onClick={()=>setOffset(o=>o+1)}>›</button></div></div>
    <div className="cal-days">{DAY_LABELS.map(d=><div key={d} className="cal-day-label">{d}</div>)}</div>
    <div className="cal-days">{cells.map((c,i)=>{
      const isToday=isCurrentMonth&&c.num===today;
      const dots=c.num?getDotsForDay(c.num):[];
      return(<div key={i} className={`cal-cell${isToday?' today':''}${!c.num?' empty':''}`}>
        <div className="cal-cell-num">{c.num||''}</div>
        {dots.length>0&&<div className="cal-dots">{dots.map((s,j)=><div key={j} className={`cal-dot ${s}`}/>)}</div>}
      </div>);
    })}</div></div>);
}

function WeeklyChart({log}){
  const weeks=[];const now=new Date();
  for(let w=7;w>=0;w--){
    const weekStart=new Date(now);weekStart.setDate(now.getDate()-now.getDay()+1-(w*7));
    let count=0;const label=`${weekStart.getDate()}/${weekStart.getMonth()+1}`;
    for(let d=0;d<7;d++){const day=new Date(weekStart);day.setDate(weekStart.getDate()+d);
      const key=`${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
      if(log[key]&&log[key].length>0)count+=log[key].length;}
    weeks.push({label,count});
  }
  const max=Math.max(...weeks.map(w=>w.count),3);
  return(<div className="chart-container"><div className="section-label" style={{marginBottom:'.75rem'}}>Activité — 8 semaines</div>
    <div className="chart-bars">{weeks.map((w,i)=><div key={i} className="chart-bar-wrap">
      {w.count>0&&<div className="chart-bar-val">{w.count}</div>}
      <div className={`chart-bar${w.count===0?' empty':''}`} style={{height:`${Math.max(w.count/max*100,4)}%`}}/>

function BoxBreathing(){

// ── MIGRATION v3 (27/07/2026) — passage en blocs de 4 semaines : l'ancienne S5 devient la nouvelle S1 ──
// Décale toutes les données de -4 semaines. Ce qui était avant S5 (ancienne Phase 1) est archivé, pas effacé du disque.
(function migrateV3(){
  try{
    if(localStorage.getItem('rh_v3'))return;
    const remap=storeKey=>{
      const raw=localStorage.getItem(storeKey);if(!raw)return;
      let o;try{o=JSON.parse(raw)}catch(e){return}
      if(!o||typeof o!=='object'||Array.isArray(o))return;
      const out={};
      Object.keys(o).forEach(k=>{
        const m=k.match(/w(\d+)$/);
        if(!m){out[k]=o[k];return;}
        const n=(+m[1])-4;
        if(n<1||n>TOTAL_WEEKS)return;
        out[k.slice(0,m.index)+'w'+n]=o[k];
      });
      localStorage.setItem(storeKey,JSON.stringify(out));
    };
    ['rh_done','rh_w','rh_bilan','rh_logk'].forEach(remap);
    let wk=1;try{wk=JSON.parse(localStorage.getItem('rh_week'))||1}catch(e){}
    localStorage.setItem('rh_week',JSON.stringify(Math.min(TOTAL_WEEKS,Math.max(1,wk>4?wk-4:1))));
    localStorage.setItem('rh_v3','1');
  }catch(e){}
})();

// ── APP ──
function App(){
  const T=useGlobalTimers();
  const[week,setWeek]=useState(()=>{try{return JSON.parse(localStorage.getItem('rh_week'))||1}catch(e){return 1}});
  const[view,setView]=useState('home');
  const[sess,setSess]=useState(null);
  const[completed,setCompleted]=useState(()=>JSON.parse(localStorage.getItem('rh_done')||'{}'));
  const[weights,setWeights]=useState(()=>JSON.parse(localStorage.getItem('rh_w')||'{}'));
  const[bilans,setBilans]=useState(()=>JSON.parse(localStorage.getItem('rh_bilan')||'{}'));
  const[trainingLog,setTrainingLog]=useState(()=>JSON.parse(localStorage.getItem('rh_log')||'{}'));
  const[measures,setMeasures]=useState(()=>JSON.parse(localStorage.getItem('rh_meas')||'[]'));
  const[swaps,setSwaps]=useState(()=>JSON.parse(localStorage.getItem('rh_swap')||'{}'));
  const[cpAnswers,setCpAnswers]=useState(()=>JSON.parse(localStorage.getItem('rh_cp')||'{}'));

  const[p3Unlocked,setP3Unlocked]=useState(true);
  const[daily,setDaily]=useState(()=>JSON.parse(localStorage.getItem('rh_daily')||'{}'));
  const[supp,setSupp]=useState(()=>JSON.parse(localStorage.getItem('rh_supp')||'{}'));
  // logk = séances déjà loguées au calendrier (anti-doublons). Migration depuis l'ancien système.
  const[logk,setLogk]=useState(()=>{
    const s=localStorage.getItem('rh_logk');if(s)return JSON.parse(s);
    const done=JSON.parse(localStorage.getItem('rh_done')||'{}');const k={};
    for(let w=1;w<=TOTAL_WEEKS;w++){['A','B','C','D'].forEach(l=>{const ph=phaseFor(w);if(!ph[l])return;
      const e=ph[l].supersets.reduce((a,ss)=>a.concat(ss.exercises),[]);
      if(e.length&&e.every(x=>done[`${x.id}-w${w}`]))k[`${l}-w${w}`]='migrated';});}
    return k;});

  useEffect(()=>{localStorage.setItem('rh_done',JSON.stringify(completed))},[completed]);
  useEffect(()=>{localStorage.setItem('rh_w',JSON.stringify(weights))},[weights]);
  useEffect(()=>{localStorage.setItem('rh_bilan',JSON.stringify(bilans))},[bilans]);
  useEffect(()=>{localStorage.setItem('rh_log',JSON.stringify(trainingLog))},[trainingLog]);
  useEffect(()=>{localStorage.setItem('rh_meas',JSON.stringify(measures))},[measures]);
  useEffect(()=>{localStorage.setItem('rh_swap',JSON.stringify(swaps))},[swaps]);
  useEffect(()=>{localStorage.setItem('rh_cp',JSON.stringify(cpAnswers))},[cpAnswers]);
  useEffect(()=>{localStorage.setItem('rh_p2',JSON.stringify(p2Unlocked))},[p2Unlocked]);
  useEffect(()=>{localStorage.setItem('rh_p3',JSON.stringify(p3Unlocked))},[p3Unlocked]);
  useEffect(()=>{localStorage.setItem('rh_daily',JSON.stringify(daily))},[daily]);
  useEffect(()=>{localStorage.setItem('rh_supp',JSON.stringify(supp))},[supp]);
  useEffect(()=>{localStorage.setItem('rh_logk',JSON.stringify(logk))},[logk]);
  useEffect(()=>{localStorage.setItem('rh_week',JSON.stringify(week))},[week]);

  const phase=phaseFor(week);
  const bloc=blocInfo(week);
  const wib=weekInBloc(week);

  const flat=l=>{const s=phase[l];return s?s.supersets.reduce((a,ss)=>a.concat(ss.exercises),[]):[];};
  const toggle=id=>{const k=`${id}-w${week}`;setCompleted(p=>({...p,[k]:!p[k]}))};
  const upW=(k,v)=>setWeights(p=>({...p,[k]:v}));

  // ── VALIDATION GROUPÉE (rattrapage) ──
  // Coche/décoche une séance entière, ou les 3 séances obligatoires de la semaine d'un coup.
  const setSessionDone=(l,val)=>{
    setCompleted(p=>{const n={...p};flat(l).forEach(x=>{n[`${x.id}-w${week}`]=val});WARMUP.forEach(x=>{n[`${x.id}-w${week}`]=val});return n;});
  };
  const setWeekDone=val=>{
    setCompleted(p=>{const n={...p};['A','B','C'].forEach(l=>flat(l).forEach(x=>{n[`${x.id}-w${week}`]=val}));WARMUP.forEach(x=>{n[`${x.id}-w${week}`]=val});return n;});
  };

  const isDone=l=>{const e=flat(l);return e.length&&e.every(x=>completed[`${x.id}-w${week}`])};
  const prog=l=>{const e=flat(l);return e.length?Math.round(e.filter(x=>completed[`${x.id}-w${week}`]).length/e.length*100):0};
  const tonnage=()=>{let t=0;['A','B','C','D'].forEach(l=>{flat(l).forEach(ex=>{if(!ex.hasWeight)return;const w=parseFloat(weights[`${ex.id}-w${week}`]);const r=repsOf(ex.volume);if(!isNaN(w)&&r)t+=w*r;});});return Math.round(t);};
  const doneSess=()=>['A','B','C'].filter(isDone).length;

  // Log session — gardé par logk pour éviter les séances fantômes au calendrier
  useEffect(()=>{
    ['A','B','C','D'].forEach(l=>{
      if(isDone(l)){
        const key=`${l}-w${week}`;
        if(!logk[key]){
          const today=todayStr();
          setLogk(p=>({...p,[key]:today}));
          setTrainingLog(prev=>{
            const existing=prev[today]||[];
            if(!existing.includes(l))return{...prev,[today]:[...existing,l]};
            return prev;
          });
        }
      }
    });
  },[completed]);

  // Bilan
  const setBilanScore=(testId,score)=>{const k=`w${week}`;setBilans(p=>({...p,[k]:{...(p[k]||{}), [testId]:score}}));};
  const getBilanScore=testId=>(bilans[`w${week}`]||{})[testId];
  const getZone=score=>{
    if(score===undefined||score===null)return null;
    if(score<=2)return{label:'🟢 Zone Verte',color:'var(--green)',msg:'Bruit de fond, on continue de charger.'};
    if(score<=5)return{label:'🟠 Zone Orange',color:'var(--orange)',msg:'Mêmes poids, pas de montée. Insiste sur la mobilité.'};
    return{label:'🔴 Zone Rouge',color:'var(--red)',msg:'Réduis 30%, variantes les plus simples.'};
  };
  // Zone moyenne de la semaine courante (pour les recos)
  const weekZoneCode=()=>{
    const b=bilans[`w${week}`]||{};const vals=BILAN_TESTS.map(t=>b[t.id]).filter(s=>s!==undefined&&s!==null);
    if(!vals.length)return 'none';
    const avg=vals.reduce((a,c)=>a+c,0)/vals.length;
    return avg<=2?'green':avg<=5?'orange':'red';
  };
  // Reco de poids: basée sur S précédente + zone
  const recoFor=ex=>{
    if(!ex.hasWeight)return null;
    const last=parseFloat(weights[`${ex.id}-w${week-1}`]);
    const zone=weekZoneCode();
    if(isNaN(last)){return {value:'', text:'1ère charge : commence léger, technique parfaite (tu reprends après 1 mois).'};}

    if(zone==='orange')return {value:last, text:`Zone orange → tu maintiens : ${last} kg`};
    // green ou none -> progression douce
    return {value:Math.round((last+2.5)*2)/2, text:`Tout vert → +2,5 kg : ${Math.round((last+2.5)*2)/2} kg`};
  };

  // Swap
  const swapKey=(l,exId)=>`${l}-${exId}`;
  const cycleSwap=(l,ex)=>{
    const k=swapKey(l,ex.id);const max=(ex.alts||[]).length;
    setSwaps(p=>{const cur=p[k]===undefined?-1:p[k];const next=cur+1>=max?-1:cur+1;return{...p,[k]:next};});
  };

  // Mensurations
  const lastMeas=measures.length?measures[measures.length-1]:null;
  const firstMeas=measures.length?measures[0]:null;
  const addMeasure=(m)=>{
    if(m.pince==''&&m.taille==''&&m.hanches==''&&m.poids=='')return;
    setMeasures(prev=>[...prev,{date:todayStr(),...m}]);
  };

  // Checkpoints
  const rangeDone=(from,to)=>{
    for(let w=from;w<=to;w++){
      const ph=phaseFor(w);
      for(const l of ['A','B','C']){
        const e=ph[l].supersets.reduce((a,ss)=>a.concat(ss.exercises),[]);
        if(!e.every(x=>completed[`${x.id}-w${w}`]))return false;
      }
    }
    return true;
  };
  const bilanGreen=wk=>{
    const b=bilans[wk]||{};
    const vals=BILAN_TESTS.map(t=>b[t.id]);
    if(vals.some(v=>v===undefined||v===null))return false;
    return vals.every(v=>v<=2);
  };
  const cpAllOk=()=>CP_QUESTIONS.every(q=>cpAnswers[q.id]===q.good);
  const setCp=(id,v)=>setCpAnswers(p=>({...p,[id]:v}));

  const selectWeek=w=>{
    setWeek(w);
  };

  // ── WORKOUT ──
  if(view==='workout'&&sess){
    const s=phase[sess];const p=prog(sess);
    return(<div className="app"><div className="workout-view">
      <div className="topbar"><div className="back-btn" onClick={()=>setView('home')}>←</div><div><div className="topbar-title">{s.title}</div><div className="topbar-sub">{bloc.short} · S{wib} · {p}% · {s.duration}</div></div></div>

      </div></div><Sticky T={T}/><NavBar view={view} setView={setView}/></div>);
  }

  // ── CHECKPOINT PHASE 2 ──
  if(view==='checkpoint'){
    const r1=rangeDone(1,4),r2=bilanGreen('w4'),r3=cpAllOk();
    const ready=r1&&r2&&r3;
    return(<div className="app"><div className="workout-view">
      <div className="topbar"><div className="back-btn" onClick={()=>setView('home')}>←</div><div><div className="topbar-title">Déverrouillage Phase 2</div><div className="topbar-sub">Explosivité / Basket — voyants verts requis</div></div></div>
      <div className="workout-hero"><div className="hero-title">Checkpoint</div><div className="hero-sub">La Phase 2 charge lourd et saute. On ne l'ouvre que si ton corps est prêt — surtout ce genou droit.</div></div>
      <div className="ex-section">
        <div className="ex-sec-label">Conditions</div>
        <div className={`cp-req ${r1?'ok':'ko'}`}><div className="dot">{r1?'✓':'1'}</div><div className="cp-req-main"><div className="cp-req-t">Toutes les séances S1→S4 terminées</div><div className="cp-req-s">Phase 1 bouclée intégralement</div></div></div>
        <div className={`cp-req ${r2?'ok':'ko'}`}><div className="dot">{r2?'✓':'2'}</div><div className="cp-req-main"><div className="cp-req-t">4 tests Bilan en zone verte (≤2)</div><div className="cp-req-s">Remplis le Bilan en semaine 4</div></div></div>
        <div className={`cp-req ${r3?'ok':'ko'}`}><div className="dot">{r3?'✓':'3'}</div><div className="cp-req-main"><div className="cp-req-t">Questionnaire ressenti au vert</div><div className="cp-req-s">Réponds ci-dessous</div></div></div>

        <div className="ex-sec-label">Questionnaire ressenti</div>
        {CP_QUESTIONS.map(q=>(<div key={q.id} className="q-row">
          <div className="q-label">{q.label}</div>
          <div className="q-opts">{q.opts.map(o=>(<div key={o.v} className={`q-opt${cpAnswers[q.id]===o.v?' sel':''}`} onClick={()=>setCp(q.id,o.v)}>{o.t}</div>))}</div>
        </div>))}

        <button className={`cp-unlock ${ready?'ready':'notready'}`} disabled={!ready} onClick={()=>{if(ready){setP2Unlocked(true);setWeek(5);setView('home');}}}>
          {ready?'🔓 Débloquer la Phase 2':'🔒 Voyants pas tous au vert'}
        </button>
        {!ready&&<div style={{fontSize:'.8rem',color:'var(--sub)',textAlign:'center',marginTop:'.75rem',lineHeight:1.5}}>Si un voyant reste rouge/orange, ce n'est pas un échec : tu prolonges la Phase 1 une semaine. La voie rapide vers octobre, c'est un genou sain — pas un genou en reconstruction précipitée.</div>}
      </div></div><Sticky T={T}/><NavBar view={view} setView={setView}/></div>);
  }

  // ── CHECKPOINT PRÉ-SAISON (S11-14) ──
  if(view==='checkpoint3'){
    const r1=rangeDone(5,10),r2=bilanGreen('w10');
    const ready=r1&&r2;
    return(<div className="app"><div className="workout-view">
      <div className="topbar"><div className="back-btn" onClick={()=>setView('home')}>←</div><div><div className="topbar-title">Déverrouillage Pré-saison</div><div className="topbar-sub">S11-14 — le dernier bloc avant octobre</div></div></div>
      <div className="workout-hero"><div className="hero-title">Pré-saison 🏀</div><div className="hero-sub">Sauts complets, sprints, efforts type match. Réservé à un genou qui ne gonfle plus du tout.</div></div>
      <div className="ex-section">
        <div className="ex-sec-label">Conditions</div>
        <div className={`cp-req ${r1?'ok':'ko'}`}><div className="dot">{r1?'✓':'1'}</div><div className="cp-req-main"><div className="cp-req-t">Toutes les séances S5→S10 terminées</div><div className="cp-req-s">Phase 2 bouclée intégralement</div></div></div>
        <div className={`cp-req ${r2?'ok':'ko'}`}><div className="dot">{r2?'✓':'2'}</div><div className="cp-req-main"><div className="cp-req-t">Bilan S10 : 4 tests en zone verte (≤2)</div><div className="cp-req-s">Re-passe le Bilan complet en semaine 10</div></div></div>
        <button className={`cp-unlock ${ready?'ready':'notready'}`} disabled={!ready} onClick={()=>{if(ready){setP3Unlocked(true);setWeek(11);setView('home');}}}>
          {ready?'🔓 Ouvrir la Pré-saison':'🔒 Voyants pas tous au vert'}
        </button>
        {!ready&&<div style={{fontSize:'.8rem',color:'var(--sub)',textAlign:'center',marginTop:'.75rem',lineHeight:1.5}}>Un voyant orange = tu prolonges la Phase 2 d'une semaine. Arriver en octobre à 90% mais sain vaut mieux qu'à 100% cassé en novembre.</div>}
      </div></div><Sticky T={T}/><NavBar view={view} setView={setView}/></div>);
  }

  // ── CARDIO / VÉLO ──
  if(view==='cardio'){
    return(<div className="app"><div className="workout-view">
      <div className="topbar"><div className="back-btn" onClick={()=>setView('home')}>←</div><div><div className="topbar-title">Cardio / Vélo</div><div className="topbar-sub">Ton outil genou + ta soupape cardio</div></div></div>
      <div className="workout-hero"><div className="hero-title">Le Vélo</div><div className="hero-sub">Zéro impact pour le genou. 4 usages selon le moment — du spin de réhab quotidien aux intervalles où tu te lâches.</div></div>
      <div className="ex-section">{CARDIO.map((c,i)=><div key={i} className="recov-card"><div className="recov-name">{i+1}. {c.name}</div><div className="recov-desc">{c.desc}</div><div className="recov-vol">{c.volume}</div></div>)}</div>
    </div><Sticky T={T}/><NavBar view={view} setView={setView}/></div>);
  }

  // ── MENSURATIONS ──
  if(view==='measures'){
    return <MeasuresView measures={measures} addMeasure={addMeasure} lastMeas={lastMeas} firstMeas={firstMeas} setView={setView} view={view} T={T}/>;
  }

  // ── NUTRITION ──
  if(view==='nutrition'){
    const t=todayStr();const sd=supp[t]||{};
    const toggleSupp=id=>setSupp(p=>({...p,[t]:{...(p[t]||{}),[id]:!(p[t]||{})[id]}}));
    const nSupp=SUPPS.filter(s=>sd[s.id]).length;
    return(<div className="app"><div className="workout-view">
      <div className="topbar"><div className="back-btn" onClick={()=>setView('home')}>←</div><div><div className="topbar-title">Nutrition</div><div className="topbar-sub">2200 kcal · 2 repas + 1 collation · compatible 16/8</div></div></div>
      <div className="workout-hero"><div className="hero-title">2200 <span style={{fontSize:'1.1rem',color:'var(--sub)',fontWeight:600}}>kcal/jour</span></div>
        <div className="hero-sub">Déficit doux ~−350. Juge de paix = la pince à J14, jamais la balance. Plancher 2000 kcal — 1800 BANNI.</div>
        <div className="hero-tags"><span className="hero-tag" style={{color:'var(--accent)',borderColor:'rgba(232,255,71,.4)'}}>P 180 g</span><span className="hero-tag">L 75 g</span><span className="hero-tag">C 200 g</span><span className="hero-tag">Zéro ail/oignon</span></div></div>
      <div className="ex-section">
        <div className="ex-sec-label">🍽️ Tes 3 prises</div>
        {MEALS.map((m,i)=>(<div key={i} className="recov-card"><div className="recov-name">{m.ic} {m.name}</div>
          <div><span className="meal-macros">{m.kcal} · {m.macros}</span></div>
          {m.items.map((it,j)=><div key={j} className="meal-item">{it}</div>)}</div>))}
        <div className="ex-sec-label">💊 Suppléments du jour — {nSupp}/{SUPPS.length}</div>
        {SUPPS.map(s=>(<div key={s.id} className={`supp-row${sd[s.id]?' ok':''}`} onClick={()=>toggleSupp(s.id)}>
          <div className="supp-check">{sd[s.id]&&'✓'}</div><div><div className="supp-t">{s.t}</div><div className="supp-s">{s.s}</div></div></div>))}
        <div className="ex-sec-label">⚠️ Vigilance SII</div>

      </div></div><Sticky T={T}/><NavBar view={view} setView={setView}/></div>);
  }

  // ── OUTILS SOMMEIL ──
  if(view==='tools'){
    return(<div className="app"><div className="workout-view">
      <div className="topbar"><div className="back-btn" onClick={()=>setView('plus')}>←</div><div><div className="topbar-title">Sommeil & Récup</div><div className="topbar-sub">Ta nuit fait ~3h — la sieste est un outil de perf</div></div></div>
      <div className="ex-section" style={{paddingTop:'.5rem'}}>
        <div className="ex-sec-label">😴 Power Nap — 20 min STRICT</div>
        <Timer id="nap" seconds={1200} T={T} label="😴 Sieste — alarme à 20:00"/>
        <div className="recov-card" style={{marginTop:'.75rem'}}><div className="recov-desc">Jamais plus de 25 min (inertie + destruction de la pression de sommeil). Noir complet. Enchaîne avec la respiration carrée pour t'endormir vite.</div></div>
        <div className="ex-sec-label">🫁 Respiration carrée</div>
        <BoxBreathing/>
      </div></div><Sticky T={T}/><NavBar view={view} setView={setView}/></div>);
  }

  // ── RÉGLAGES ──
  if(view==='settings'){
    const exportData=()=>{const o={};Object.keys(localStorage).forEach(k=>{if(k.indexOf('rh_')===0)o[k]=localStorage.getItem(k);});const b=new Blob([JSON.stringify(o,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`rehaab-backup-${todayStr()}.json`;a.click();};
    const importData=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);Object.keys(o).forEach(k=>{if(k.indexOf('rh_')===0)localStorage.setItem(k,o[k]);});location.reload();}catch(err){alert('Fichier invalide');}};r.readAsText(f);};
    const resetData=()=>{if(confirm('Tout effacer ? (séances, charges, mesures) Cette action est définitive.')){Object.keys(localStorage).forEach(k=>{if(k.indexOf('rh_')===0)localStorage.removeItem(k);});location.reload();}};
    return(<div className="app"><div className="workout-view">
      <div className="topbar"><div className="back-btn" onClick={()=>setView('plus')}>←</div><div><div className="topbar-title">Réglages</div><div className="topbar-sub">Sauvegarde & données</div></div></div>
      <div className="ex-section" style={{paddingTop:'.5rem'}}>
        <div className="ex-sec-label">💾 Sauvegarde</div>
        <div className="recov-card" style={{marginBottom:'1rem'}}><div className="recov-desc">Tes données vivent dans CE navigateur uniquement. Exporte régulièrement — surtout avant de changer de téléphone ou vider le cache.</div></div>
        <button className="set-btn accent" onClick={exportData}>⬇ Exporter mes données (JSON)</button>
        <label className="set-btn" style={{cursor:'pointer'}}>⬆ Importer une sauvegarde<input type="file" accept=".json" style={{display:'none'}} onChange={importData}/></label>
        <div className="ex-sec-label" style={{marginTop:'1.5rem'}}>⚠️ Zone dangereuse</div>
        <button className="set-btn danger" onClick={resetData}>🗑 Tout réinitialiser</button>
      </div></div><Sticky T={T}/><NavBar view={view} setView={setView}/></div>);
  }

  // ── PLUS ──
  if(view==='plus'){
    const items=[
      {v:'bilan',ic:'📋',t:'Bilan hebdo',s:'4 tests articulaires · pilote tes recos de charge'},
      !p2Unlocked?{v:'checkpoint',ic:'🔓',t:'Checkpoint Phase 2',s:'Conditions de déblocage de l\'explosivité'}:null,
      p2Unlocked&&!p3Unlocked?{v:'checkpoint3',ic:'🏀',t:'Checkpoint Pré-saison',s:'Conditions du dernier bloc avant octobre'}:null,
      {v:'cardio',ic:'🚴',t:'Vélo',s:'4 usages : réhab genou, échauffement, intervalles, flush'},
      {v:'recovery',ic:'🧘',t:'Récupération',s:'Protocole 15 min au sol · jours OFF'},
      {v:'tools',ic:'😴',t:'Sommeil & respiration',s:'Power nap 20 min + respiration carrée'},
      {v:'settings',ic:'⚙️',t:'Réglages',s:'Export / import / reset des données'},
    ].filter(Boolean);
    return(<div className="app"><div className="workout-view">
      <div className="topbar"><div><div className="topbar-title">Plus</div><div className="topbar-sub">Protocoles & outils</div></div></div>
      <div className="ex-section" style={{paddingTop:'.5rem'}}>
        {items.map(it=>(<div key={it.v} className="plus-item" onClick={()=>setView(it.v)}><div className="plus-ic">{it.ic}</div><div style={{flex:1}}><div className="plus-t">{it.t}</div><div className="plus-s">{it.s}</div></div><div className="s-arrow">›</div></div>))}
      </div></div><Sticky T={T}/><NavBar view={view} setView={setView}/></div>);
  }

  // ── HOME ──
  const recentLog=Object.entries(trainingLog).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);
  const nextSess=['A','B','C'].find(l=>!isDone(l));
  const weekFull=doneSess()>=3;
  return(<div className="app">
    <div className="header">
      <div className="header-top"><div className="title">Rehaab<span>.</span></div><div className={`phase-pill${bloc.n>1?' p2':''}`}>{bloc.ic} {bloc.short}</div></div>
      <div className="week-row">{BLOCS.map(b=>(
        <button key={b.n} className={`week-btn${bloc.n===b.n?' active':''}`} onClick={()=>selectWeek((b.n-1)*4+1)}>{b.ic} {b.short}</button>))}</div>
      <div className="week-row">{[1,2,3,4].map(i=>{const w=(bloc.n-1)*4+i;
        return <button key={w} className={`week-btn${week===w?' active':''}`} onClick={()=>selectWeek(w)}>S{i}</button>;})}</div>
    </div>

    <div className="section" style={{paddingTop:'1.25rem'}}>
      <div className="wk-intent" style={{marginBottom:'1rem'}}><div className="ic">{bloc.ic}</div><div><div className="t"><span>{bloc.name}</span> · S{wib}/4</div><div className="s">{bloc.sub}</div></div></div>
      {nextSess?<div className="cta" onClick={()=>{setSess(nextSess);setView('workout')}}><div className="cta-play">▶</div><div style={{flex:1}}><div className="cta-big">Séance {nextSess} — {phase[nextSess].sub}</div><div className="cta-small">Ta prochaine séance · {bloc.name} · S{wib} · {phase[nextSess].duration}</div></div></div>
      :<div className="cta" onClick={()=>{if(week<TOTAL_WEEKS)selectWeek(week+1)}}><div className="cta-play">💪</div><div style={{flex:1}}><div className="cta-big">S{wib} bouclée — {bloc.short}</div><div className="cta-small">{week<TOTAL_WEEKS?(wib===4?`Appuie pour ouvrir "${(BLOCS[bloc.n]||{}).name||''}"`:`Appuie pour passer en S${wib+1}`):'Programme terminé — reprise basket 🏀'}</div></div></div>}
    </div>

    <div className="section" style={{paddingTop:'.75rem'}}>
      <div style={{display:'flex',gap:'.5rem'}}>
        <button className="set-btn" style={{flex:1,marginBottom:0}} onClick={()=>setWeekDone(!weekFull)}>{weekFull?'↩︎ Décocher la semaine':'✓ Valider la semaine'}</button>
        <button className="set-btn accent" style={{flex:1,marginBottom:0}} onClick={()=>{if(week<TOTAL_WEEKS)selectWeek(week+1)}}>Semaine suivante →</button>
      </div>
      <div style={{fontSize:'.72rem',color:'var(--muted)',marginTop:'.5rem',lineHeight:1.5}}>Rattrapage : "Valider la semaine" coche les séances A, B et C + l'échauffement. La Séance D (optionnelle) se valide séparément depuis la séance. Tu peux changer de semaine ou de bloc quand tu veux, rien n'est verrouillé.</div>
    </div>

    <div className="section" style={{paddingTop:'1.5rem'}}><div className="section-label">Intention de la semaine</div>
      <div className="wk-intent"><div className="ic">{bloc.ic}</div><div><div className="t">S{wib}/4 — <span>{WEEK_PLAN[week].tag}</span> · {WEEK_PLAN[week].rpe}</div><div className="s">{WEEK_PLAN[week].focus}</div></div></div>
    </div>

    <div className="section" style={{paddingTop:'1.5rem'}}><div className="section-label">Résumé — {bloc.name} · S{wib}</div>
      <div className="stats-grid">
        <div className="stat-card"><div className="stat-card-label">Séances faites</div><div className="stat-card-value">{doneSess()}<span>/3</span></div></div>
        <div className="stat-card"><div className="stat-card-label">Tonnage estimé</div><div className="stat-card-value">{tonnage()>=1000?`${Math.round(tonnage()/100)/10}`:tonnage()}<span>{tonnage()>=1000?' t':' kg'}</span></div><div className="stat-card-sub">charges × séries × reps</div></div>
        <div className="stat-card" onClick={()=>setView('nutrition')} style={{cursor:'pointer'}}><div className="stat-card-label">Suppléments du jour</div><div className="stat-card-value">{SUPPS.filter(s=>(supp[todayStr()]||{})[s.id]).length}<span>/{SUPPS.length}</span></div><div className="stat-card-sub">appuie pour cocher</div></div>
      </div>
    </div>

    {lastMeas&&<div className="section" style={{paddingTop:'1.5rem'}}><div className="section-label">Pince ombilicale (ton juge de paix)</div>
      <div className="banner" onClick={()=>setView('measures')}><div className="banner-ic">📏</div><div className="banner-main"><div className="banner-t">{lastMeas.pince||'—'} mm{firstMeas&&firstMeas.pince&&lastMeas.pince?<span style={{color:(lastMeas.pince-firstMeas.pince)<=0?'var(--green)':'var(--orange)',fontSize:'.8rem',marginLeft:'8px'}}>{(lastMeas.pince-firstMeas.pince)<=0?'▼':'▲'} {Math.abs(lastMeas.pince-firstMeas.pince)} mm depuis le début</span>:null}</div><div className="banner-s">Dernière mesure le {fmtShort(lastMeas.date)} · appuie pour suivre</div></div><div className="s-arrow">›</div></div>
    </div>}

    <div className="section" style={{paddingTop:'1.5rem'}}><div className="section-label">Choisis ta séance</div>
      <div className="session-list">{['A','B','C','D'].map(l=>{
        const s=phase[l];const done=isDone(l);const p=prog(l);
        return(<div key={l} className="session-row" onClick={()=>{setSess(l);setView('workout')}}>
          <div className={`s-num ${l}`}>{l}</div><div className="s-info"><div className="s-name">{s.sub}</div><div className="s-day">{p}% complété</div><div className="s-meta">⏱ {s.duration}</div></div>
          {done?<div className="s-check">✓</div>:<div className="s-arrow">›</div>}</div>);
      })}</div>
    </div>

    <div className="section" style={{paddingTop:'1.5rem'}}><div className="section-label">Calendrier d'entraînement</div>
      <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'1.25rem'}}>
        <Calendar log={trainingLog}/>
        <div style={{display:'flex',gap:'1rem',marginTop:'1rem',justifyContent:'center',flexWrap:'wrap'}}>
          <div style={{display:'flex',alignItems:'center',gap:'6px',fontSize:'.75rem',color:'var(--sub)'}}><div className="cal-dot A" style={{position:'static'}}/>Séance A</div>
          <div style={{display:'flex',alignItems:'center',gap:'6px',fontSize:'.75rem',color:'var(--sub)'}}><div className="cal-dot B" style={{position:'static'}}/>Séance B</div>
          <div style={{display:'flex',alignItems:'center',gap:'6px',fontSize:'.75rem',color:'var(--sub)'}}><div className="cal-dot C" style={{position:'static'}}/>Séance C</div>
          <div style={{display:'flex',alignItems:'center',gap:'6px',fontSize:'.75rem',color:'var(--sub)'}}><div className="cal-dot D" style={{position:'static'}}/>Séance D</div>
        </div>
      </div>
    </div>

    <div className="section" style={{paddingTop:'1.5rem'}}><div className="section-label">Suivi d'activité</div>
      <WeeklyChart log={trainingLog}/>
    </div>

    {recentLog.length>0&&<div className="section" style={{paddingTop:'1.5rem'}}><div className="section-label">Dernières séances</div>
      <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'1rem 1.25rem'}}>
        {recentLog.map(([date,sessions])=>(<div key={date} className="log-row"><div className="log-date">{fmtShort(date)}</div>
            <div style={{display:'flex',gap:'6px'}}>{sessions.map((s,i)=><div key={i} className={`log-badge ${s}`}>Séance {s}</div>)}</div></div>))}
      </div>
    </div>}

    <Sticky T={T}/><NavBar view={view} setView={setView}/>
  </div>);
}

// ── MENSURATIONS VIEW ──
function MeasuresView({measures,addMeasure,lastMeas,firstMeas,setView,view,T}){
  const[f,setF]=useState({pince:'',taille:'',hanches:'',poids:''});
  const num=v=>v===''||v===null||v===undefined?null:parseFloat(v);
  const series=key=>measures.filter(m=>num(m[key])!==null).map(m=>({v:num(m[key])}));
  const delta=(key,unit)=>{
    const f0=firstMeas&&num(firstMeas[key]),l=lastMeas&&num(lastMeas[key]);
    if(f0===null||l===null||f0===undefined||l===undefined)return null;
    const d=l-f0;return{d,cls:d<=0?'down':'up',txt:`${d<=0?'▼':'▲'} ${Math.abs(Math.round(d*10)/10)}${unit} depuis le début`};
  };
  const ratio=m=>{const t=num(m&&m.taille),h=num(m&&m.hanches);return t&&h?Math.round(t/h*100)/100:null;};
  const cards=[
    {key:'pince',label:'Pince ombilicale',unit:'mm',color:'var(--accent)'},
    {key:'taille',label:'Tour de taille',unit:'cm',color:'#5ac8fa'},
    {key:'hanches',label:'Tour de hanches',unit:'cm',color:'#bf5af2'},
    {key:'poids',label:'Poids (secondaire)',unit:'kg',color:'var(--sub)'},
  ];
  const save=()=>{addMeasure(f);setF({pince:'',taille:'',hanches:'',poids:''});};
  return(<div className="app"><div className="workout-view">
    <div className="topbar"><div className="back-btn" onClick={()=>setView('home')}>←</div><div><div className="topbar-title">Mensurations</div><div className="topbar-sub">La pince commande. Le poids = bruit.</div></div></div>
    <div className="ex-section">
      <div className="ex-sec-label">Nouvelle mesure — {fmtShort(todayStr())}</div>
      <div className="meas-form">
        <div className="meas-grid">
          <div className="meas-field"><div className="meas-flabel">Pince ombilicale (mm)</div><input className="meas-input" type="number" inputMode="decimal" placeholder="22" value={f.pince} onChange={e=>setF({...f,pince:e.target.value})}/></div>
          <div className="meas-field"><div className="meas-flabel">Poids (kg)</div><input className="meas-input" type="number" inputMode="decimal" placeholder="88" value={f.poids} onChange={e=>setF({...f,poids:e.target.value})}/></div>
          <div className="meas-field"><div className="meas-flabel">Tour de taille (cm)</div><input className="meas-input" type="number" inputMode="decimal" placeholder="91" value={f.taille} onChange={e=>setF({...f,taille:e.target.value})}/></div>
          <div className="meas-field"><div className="meas-flabel">Tour de hanches (cm)</div><input className="meas-input" type="number" inputMode="decimal" placeholder="100" value={f.hanches} onChange={e=>setF({...f,hanches:e.target.value})}/></div>
        </div>
        <button className="meas-save" onClick={save}>Enregistrer la mesure</button>
      </div>

      <div className="ex-sec-label">Évolution</div>
      <div className="meas-cards">{cards.map(c=>{const last=lastMeas&&num(lastMeas[c.key]);const dl=delta(c.key,c.unit);
        return(<div key={c.key} className="meas-stat"><div className="meas-stat-l">{c.label}</div>
          <div className="meas-stat-v">{last!==null&&last!==undefined?last:'—'}<span> {c.unit}</span></div>
          {dl&&<div className={`meas-delta ${dl.cls}`}>{dl.txt}</div>}</div>);
      })}</div>

      {lastMeas&&ratio(lastMeas)&&<div className="meas-stat" style={{marginBottom:'1rem'}}><div className="meas-stat-l">Ratio taille / hanches</div><div className="meas-stat-v">{ratio(lastMeas)}</div><div style={{fontSize:'.72rem',color:'var(--sub)',marginTop:'.25rem'}}>Vise &lt; 0,90. Indicateur de gras abdominal.</div></div>}

      <div className="ex-sec-label">Courbe de la pince (mm)</div>
      <div className="chart-container"><Sparkline points={series('pince')} color="var(--accent)"/></div>

      {measures.length>0&&<div><div className="ex-sec-label">Historique</div>
        <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'.5rem 1.25rem'}}>
          {[...measures].reverse().map((m,i)=>(<div key={i} className="meas-hist-row"><div className="meas-hist-date">{fmtShort(m.date)}</div>
            <div className="meas-hist-vals">{m.pince!==''&&m.pince!=null&&<span>Pince <b>{m.pince}mm</b></span>}{m.taille!==''&&m.taille!=null&&<span>Taille <b>{m.taille}</b></span>}{m.hanches!==''&&m.hanches!=null&&<span>Hanches <b>{m.hanches}</b></span>}{m.poids!==''&&m.poids!=null&&<span>Poids <b>{m.poids}</b></span>}</div></div>))}
        </div></div>}
    </div>
  </div><Sticky T={T}/><NavBar view={view} setView={setView}/></div>);
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});}
</script>
