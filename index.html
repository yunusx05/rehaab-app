<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rehaab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
:root{--bg:#000;--card:#111;--card2:#1a1a1a;--border:#222;--text:#fff;--muted:#555;--sub:#888;--accent:#E8FF47;--red:#ff453a;--green:#30d158;--orange:#ff9f0a;--radius:20px;--radius-sm:14px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:3rem;}

/* HEADER */
.header{padding:3rem 1.5rem 1.25rem;background:var(--bg);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem;}
.title{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;letter-spacing:-1px;line-height:1;}
.title span{color:var(--accent);}
.phase-pill{background:var(--card2);border:1px solid var(--border);border-radius:100px;padding:0.4rem 1rem;font-size:0.75rem;font-weight:600;color:var(--sub);letter-spacing:0.5px;}
.phase-pill.p2{background:var(--accent);color:#000;border-color:var(--accent);}
.week-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.week-row::-webkit-scrollbar{display:none;}
.week-btn{flex-shrink:0;width:44px;height:44px;background:var(--card);border:1px solid var(--border);color:var(--sub);border-radius:12px;font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:'Syne',sans-serif;}
.week-btn.active{background:var(--accent);color:#000;border-color:var(--accent);transform:scale(1.05);box-shadow:0 6px 20px rgba(232,255,71,0.3);}

/* STATS */
.section{padding:1.5rem 1.5rem 0;}
.section-label{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:1rem;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;}
.stat-card-label{font-size:0.8rem;color:var(--sub);font-weight:500;margin-bottom:0.5rem;}
.stat-card-value{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;letter-spacing:-1.5px;}
.stat-card-value span{font-size:1rem;color:var(--sub);font-weight:500;margin-left:2px;letter-spacing:0;}
.stat-card-sub{font-size:0.75rem;color:var(--muted);margin-top:0.25rem;}

/* CALENDAR */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.day-card{aspect-ratio:1;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.25s cubic-bezier(.4,0,.2,1);position:relative;}
.day-card.workout:active{transform:scale(0.92);}
.day-card.today-w{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.day-card.rest{opacity:0.25;cursor:default;}
.day-name{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;color:var(--muted);margin-bottom:4px;}
.day-card.today-w .day-name{color:var(--accent);}
.day-letter{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;}
.done-dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--green);}

/* SESSIONS */
.session-list{display:flex;flex-direction:column;gap:10px;}
.session-row{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;display:flex;align-items:center;gap:1.25rem;cursor:pointer;transition:all 0.2s;}
.session-row:active{transform:scale(0.98);background:var(--card2);}
.session-row.today{border-color:var(--accent);}
.s-num{width:44px;height:44px;background:var(--card2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;flex-shrink:0;}
.session-row.today .s-num{background:var(--accent);color:#000;}
.s-info{flex:1;}
.s-name{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:700;margin-bottom:0.2rem;}
.s-day{font-size:0.8rem;color:var(--sub);}
.s-arrow{color:var(--muted);font-size:1.4rem;}
.s-check{color:var(--green);font-size:1.3rem;font-weight:700;}

/* WORKOUT VIEW */
.workout-view{animation:fadeUp 0.3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.topbar{padding:1.5rem 1.5rem 0;display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;}
.back-btn{width:40px;height:40px;background:var(--card);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;flex-shrink:0;transition:all 0.2s;}
.back-btn:active{transform:scale(0.9);}
.topbar-info{}
.topbar-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;}
.topbar-sub{font-size:0.8rem;color:var(--sub);}

.workout-hero{background:var(--card);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:1.5rem;margin-bottom:1.5rem;position:relative;overflow:hidden;}
.workout-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);}
.hero-title{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;letter-spacing:-1px;margin-bottom:0.3rem;}
.hero-sub{color:var(--sub);font-size:0.9rem;font-weight:500;margin-bottom:1rem;}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap;}
.hero-tag{background:var(--card2);border:1px solid var(--border);border-radius:100px;padding:0.35rem 0.85rem;font-size:0.75rem;font-weight:600;color:var(--sub);}
.prog-bar-wrap{background:var(--card2);border-radius:100px;height:4px;overflow:hidden;margin-top:1rem;}
.prog-bar-fill{height:100%;background:var(--accent);border-radius:100px;transition:width 0.6s ease;}

/* EXERCISES */
.ex-section{padding:0 1.5rem;}
.ex-sec-label{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:1rem;padding-left:0.25rem;}
.ex-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:border-color 0.3s;}
.ex-card.done{border-color:var(--green);}
.ex-card.expanded{border-color:var(--accent);}
.ex-row{display:flex;align-items:center;gap:1rem;padding:1.1rem 1.25rem;cursor:pointer;}
.check{width:32px;height:32px;flex-shrink:0;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all 0.25s;font-size:1rem;}
.ex-card.done .check{background:var(--green);border-color:var(--green);color:#000;font-weight:700;}
.ex-main{flex:1;min-width:0;}
.ex-name{font-weight:600;font-size:0.97rem;line-height:1.3;margin-bottom:0.25rem;}
.ex-vol{font-size:0.8rem;color:var(--accent);font-weight:700;}
.ex-chev{color:var(--muted);font-size:1rem;transition:transform 0.3s;flex-shrink:0;}
.ex-card.expanded .ex-chev{transform:rotate(180deg);}
.ex-details{max-height:0;overflow:hidden;transition:max-height 0.4s cubic-bezier(.4,0,.2,1);border-top:1px solid transparent;}
.ex-card.expanded .ex-details{max-height:1200px;border-top-color:var(--border);}
.ex-body{padding:1.25rem;display:flex;flex-direction:column;gap:1rem;}
.ex-desc{font-size:0.88rem;color:var(--sub);line-height:1.6;}
.variant-box{background:var(--card2);border-left:3px solid var(--orange);border-radius:12px;padding:1rem;}
.variant-tag{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--orange);margin-bottom:0.4rem;}
.variant-text{font-size:0.85rem;color:var(--sub);line-height:1.5;}

/* TIMER */
.timer-box{background:var(--card2);border-radius:var(--radius-sm);padding:1.25rem;text-align:center;}
.timer-label{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:0.75rem;}
.timer-digits{font-family:'Syne',sans-serif;font-size:3.5rem;font-weight:800;letter-spacing:-2px;margin-bottom:1rem;transition:color 0.3s;}
.timer-digits.running{color:var(--accent);}
.timer-digits.done{color:var(--green);}
.timer-btns{display:flex;gap:8px;}
.t-btn{flex:1;background:var(--border);border:none;color:var(--text);padding:0.85rem;border-radius:12px;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif;}
.t-btn.go{background:var(--accent);color:#000;}
.t-btn:active{transform:scale(0.95);opacity:0.8;}

/* WEIGHT */
.weight-box{background:var(--card2);border-radius:var(--radius-sm);padding:1.25rem;}
.w-label{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:0.75rem;}
.w-row{display:flex;align-items:center;gap:8px;}
.w-input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:0.9rem 1rem;border-radius:12px;font-size:1.2rem;font-weight:700;font-family:'Syne',sans-serif;transition:border-color 0.2s;}
.w-input:focus{outline:none;border-color:var(--accent);}
.w-unit{font-size:0.9rem;color:var(--sub);font-weight:600;}
.w-history{display:flex;gap:6px;margin-top:0.75rem;flex-wrap:wrap;}
.w-badge{background:var(--card);border:1px solid var(--border);padding:0.3rem 0.6rem;border-radius:8px;font-size:0.75rem;font-weight:600;color:var(--sub);}
.w-badge.cur{border-color:var(--accent);color:var(--accent);}

/* VIDEO */
.video-btn{display:flex;align-items:center;justify-content:center;gap:0.5rem;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:0.9rem;text-decoration:none;color:var(--text);font-weight:600;font-size:0.9rem;transition:all 0.2s;}
.video-btn:active{background:var(--border);transform:scale(0.98);}
</style>
</head>

];

function useTimer(sec){
  const [t,setT]=useState(sec);
  const [on,setOn]=useState(false);
  const iv=useRef(null);
  useEffect(()=>{
    if(on){iv.current=setInterval(()=>setT(p=>{if(p<=1){clearInterval(iv.current);setOn(false);return 0;}return p-1;}),1000);}
    else clearInterval(iv.current);
    return()=>clearInterval(iv.current);
  },[on]);
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const toggle=()=>{if(t===0){setT(sec);return;}setOn(v=>!v);};
  const reset=()=>{clearInterval(iv.current);setOn(false);setT(sec);};
  return{t,on,done:t===0,fmt,toggle,reset};
}

function Timer({seconds}){
  const{t,on,done,fmt,toggle,reset}=useTimer(seconds);
  return(
    <div className="timer-box">
      <div className="timer-label">⏱ Temps de repos</div>
      <div className={`timer-digits${on?' running':done?' done':''}`}>{fmt(t)}</div>
      <div className="timer-btns">
        <button className="t-btn go" onClick={toggle}>{done?'🔄 Relancer':on?'⏸ Pause':'▶ Départ'}</button>
        <button className="t-btn" onClick={reset}>Reset</button>
      </div>
    </div>
  );
}

function WeightBox({exId,week,weights,onUpdate}){
  const key=`${exId}-w${week}`;
  const val=weights[key]||'';
  return(
    <div className="weight-box">
      <div className="w-label">💪 Charge — Semaine {week}</div>
      <div className="w-row">
        <input type="number" className="w-input" placeholder="0"
          value={val} onChange={e=>onUpdate(key,e.target.value)}
          onClick={e=>e.stopPropagation()}/>
        <span className="w-unit">kg</span>
      </div>
      <div className="w-history">
        {[1,2,3,4,5,6,7,8].map(w=>{
          const v=weights[`${exId}-w${w}`];
          if(!v)return null;
          return <div key={w} className={`w-badge${w===week?' cur':''}`}>S{w}: {v}kg</div>;
        })}
      </div>
    </div>
  );
}

function ExCard({ex,week,done,onToggle,weights,onWeightUpdate}){
  const[open,setOpen]=useState(false);
  return(
    <div className={`ex-card${done?' done':''}${open?' expanded':''}`}>
      <div className="ex-row">
        <div className="check" onClick={e=>{e.stopPropagation();onToggle();}}>{done&&'✓'}</div>
        <div className="ex-main" onClick={()=>setOpen(v=>!v)}>
          <div className="ex-name">{ex.name}</div>
          <div className="ex-vol">{ex.volume}{ex.rest?` · Repos ${ex.rest}s`:''}</div>
        </div>
        <div className="ex-chev" onClick={()=>setOpen(v=>!v)}>▾</div>
      </div>
      <div className="ex-details">
        <div className="ex-body">
          <div className="ex-desc">{ex.desc}</div>
          {ex.variant&&<div className="variant-box"><div className="variant-tag">Variante</div><div className="variant-text">{ex.variant}</div></div>}
          {ex.rest&&<Timer seconds={ex.rest}/>}
          {ex.hasWeight&&<WeightBox exId={ex.id} week={week} weights={weights} onUpdate={onWeightUpdate}/>}
          {ex.video&&<a href={ex.video} target="_blank" rel="noopener noreferrer" className="video-btn" onClick={e=>e.stopPropagation()}>▶ &nbsp;Voir la vidéo démo</a>}
        </div>
      </div>
    </div>
  );
}

function App(){
  const dayMap=[6,0,2,4,1,3,5];
  const todayIdx=dayMap[new Date().getDay()];
  const[week,setWeek]=useState(1);
  const[view,setView]=useState('home');
  const[sess,setSess]=useState(null);
  const[completed,setCompleted]=useState(()=>JSON.parse(localStorage.getItem('rh_done')||'{}'));
  const[weights,setWeights]=useState(()=>JSON.parse(localStorage.getItem('rh_w')||'{}'));
  useEffect(()=>{localStorage.setItem('rh_done',JSON.stringify(completed));},[completed]);
  useEffect(()=>{localStorage.setItem('rh_w',JSON.stringify(weights));},[weights]);

  const phase=week<=4?PHASE1:PHASE2;
  const phaseLabel=week<=4?'Phase 1':'Phase 2';

  const toggle=id=>{const k=`${id}-w${week}`;setCompleted(p=>({...p,[k]:!p[k]}));};
  const upW=(k,v)=>setWeights(p=>({...p,[k]:v}));
  const isDone=letter=>{const e=phase[letter]?.exercises||[];return e.length&&e.every(x=>completed[`${x.id}-w${week}`]);};
  const prog=letter=>{const e=phase[letter]?.exercises||[];if(!e.length)return 0;return Math.round(e.filter(x=>completed[`${x.id}-w${week}`]).length/e.length*100);};
  const totalKg=()=>Object.keys(weights).filter(k=>k.endsWith(`-w${week}`)).reduce((s,k)=>s+(parseFloat(weights[k])||0),0);
  const doneSessions=()=>['A','B','C'].filter(isDone).length;

  if(view==='workout'&&sess){
    const s=phase[sess];
    const p=prog(sess);
    return(
      <div className="app">
        <div className="workout-view">
          <div className="topbar">
            <div className="back-btn" onClick={()=>setView('home')}>←</div>
            <div className="topbar-info">
              <div className="topbar-title">{s.title}</div>
              <div className="topbar-sub">Semaine {week} · {p}% complété</div>
            </div>
          </div>
          <div className="workout-hero">
            <div className="hero-title">{s.title}</div>
            <div className="hero-sub">{s.sub}</div>
            <div className="hero-tags">
              <span className="hero-tag">{phaseLabel}</span>
              <span className="hero-tag">S{week}</span>
              {week<=4&&<span className="hero-tag">Tempo 3-1-1</span>}
              {week>4&&<span className="hero-tag">Explosif ↑</span>}
            </div>
            <div className="prog-bar-wrap"><div className="prog-bar-fill" style={{width:`${p}%`}}/></div>
          </div>
          <div className="ex-section">
            <div className="ex-sec-label">🔥 Échauffement obligatoire</div>
            {WARMUP.map(ex=>(
              <ExCard key={ex.id} ex={ex} week={week}
                done={!!completed[`${ex.id}-w${week}`]}
                onToggle={()=>toggle(ex.id)}
                weights={weights} onWeightUpdate={upW}/>
            ))}
            <div className="ex-sec-label" style={{marginTop:'1.5rem'}}>💪 Exercices principaux</div>
            {s.exercises.map(ex=>(
              <ExCard key={ex.id} ex={ex} week={week}
                done={!!completed[`${ex.id}-w${week}`]}
                onToggle={()=>toggle(ex.id)}
                weights={weights} onWeightUpdate={upW}/>
            ))}
          </div>
        </div>
      </div>
    );
  }

  return(
    <div className="app">
      <div className="header">
        <div className="header-top">
          <div className="title">Rehaab<span>.</span></div>
          <div className={`phase-pill${week>4?' p2':''}`}>{phaseLabel}</div>
        </div>
        <div className="week-row">
          {[1,2,3,4,5,6,7,8].map(w=>(
            <button key={w} className={`week-btn${week===w?' active':''}`} onClick={()=>setWeek(w)}>S{w}</button>
          ))}
        </div>
      </div>

      <div className="section" style={{paddingTop:'1.5rem'}}>
        <div className="section-label">Résumé — Semaine {week}</div>
        <div className="stats-grid">
          <div className="stat-card">
            <div className="stat-card-label">Séances faites</div>
            <div className="stat-card-value">{doneSessions()}<span>/3</span></div>
            <div className="stat-card-sub">cette semaine</div>
          </div>
          <div className="stat-card">
            <div className="stat-card-label">Volume total</div>
            <div className="stat-card-value">{totalKg()}<span>kg</span></div>
            <div className="stat-card-sub">semaine {week}</div>
          </div>
        </div>
      </div>

      <div className="section" style={{paddingTop:'1.5rem'}}>
        <div className="section-label">Planning hebdomadaire</div>
        <div className="calendar-grid">
          {SCHEDULE.map((d,i)=>{
            const done=d.type==='workout'&&isDone(d.s);
            const isToday=i===todayIdx;
            return(
              <div key={i} className={`day-card ${d.type}${isToday&&d.type==='workout'?' today-w':''}`}
                onClick={()=>{if(d.type==='workout'){setSess(d.s);setView('workout');}}}>
                <div className="day-name">{d.day}</div>
                <div className="day-letter">{d.s}</div>
                {done&&<div className="done-dot"/>}
              </div>
            );
          })}
        </div>
      </div>

      <div className="section" style={{paddingTop:'1.5rem'}}>
        <div className="section-label">Séances d'entraînement</div>
        <div className="session-list">
          {['A','B','C'].map((letter,idx)=>{
            const days=['Lundi','Mercredi','Vendredi'];
            const s=phase[letter];
            const done=isDone(letter);
            const p=prog(letter);
            const isToday=(letter==='A'&&todayIdx===0)||(letter==='B'&&todayIdx===2)||(letter==='C'&&todayIdx===4);
            return(
              <div key={letter} className={`session-row${isToday?' today':''}`}
                onClick={()=>{setSess(letter);setView('workout');}}>
                <div className="s-num">{letter}</div>
                <div className="s-info">
                  <div className="s-name">{s.sub}</div>
                  <div className="s-day">{days[idx]} · {p}% complété</div>
                </div>
                {done?<div className="s-check">✓</div>:<div className="s-arrow">›</div>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
