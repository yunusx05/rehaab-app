<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Rehaab</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            max-width: 100%;
            margin: 0 auto;
            min-height: 100vh;
            background: #000;
            padding-bottom: 2rem;
        }

        .header {
            padding: 1.5rem 1.25rem 1rem;
            background: #000;
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 1rem;
        }

        .week-selector {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 0.5rem;
        }

        .week-selector::-webkit-scrollbar {
            display: none;
        }

        .week-btn {
            flex-shrink: 0;
            padding: 0.6rem 1.2rem;
            background: #1c1c1e;
            border: none;
            color: #8e8e93;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .week-btn.active {
            background: #ff453a;
            color: #fff;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            padding: 1rem 1.25rem;
        }

        .day-card {
            aspect-ratio: 1;
            background: #1c1c1e;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .day-card.active {
            background: #ff453a;
            transform: scale(1.05);
        }

        .day-card.rest {
            opacity: 0.4;
        }

        .day-label {
            font-size: 0.7rem;
            color: #8e8e93;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .day-card.active .day-label {
            color: #fff;
        }

        .day-session {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .workout-view {
            padding: 0 1.25rem;
        }

        .workout-header {
            background: #1c1c1e;
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .workout-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .workout-subtitle {
            font-size: 0.9rem;
            color: #8e8e93;
        }

        .section {
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #8e8e93;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
            padding-left: 0.25rem;
        }

        .exercise-card {
            background: #1c1c1e;
            border-radius: 14px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .exercise-name {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.3;
            flex: 1;
        }

        .exercise-volume {
            font-size: 0.85rem;
            color: #ff453a;
            font-weight: 700;
            margin-left: 1rem;
            white-space: nowrap;
        }

        .exercise-desc {
            font-size: 0.85rem;
            color: #8e8e93;
            line-height: 1.4;
            margin-bottom: 0.75rem;
        }

        .exercise-variant {
            background: #0a0a0a;
            padding: 0.75rem;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #8e8e93;
            line-height: 1.4;
        }

        .variant-label {
            color: #ff9500;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .back-btn {
            position: sticky;
            bottom: 1rem;
            left: 1.25rem;
            right: 1.25rem;
            background: #1c1c1e;
            border: none;
            color: #fff;
            padding: 1rem;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 1.5rem 1.25rem 0;
        }

        .back-btn:active {
            opacity: 0.7;
        }

        .phase-info {
            background: #1c1c1e;
            border-radius: 14px;
            padding: 1rem 1.25rem;
            margin: 0 1.25rem 1rem;
            font-size: 0.85rem;
            color: #8e8e93;
            line-height: 1.5;
        }

        .phase-badge {
            display: inline-block;
            background: #ff453a;
            color: #fff;
            padding: 0.25rem 0.75rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Programme complet Phase 1 & 2
        const programData = {
            warmup: {
                title: "Échauffement Obligatoire",
                subtitle: "À faire avant CHAQUE séance",
                exercises: [
                    {
                        name: "Respiration par le ventre",
                        volume: "2 min",
                        desc: "Calmer le corps.",
                        variant: "Allongé, jambes sur une chaise."
                    },
                    {
                        name: "Essuie-glaces au sol",
                        volume: "2 x 8 / côté",
                        desc: "Débloquer la hanche. Assis, laisse tomber les genoux d'un côté puis de l'autre.",
                        variant: "Mouvement très petit si douleur."
                    },
                    {
                        name: "Étirement cheville au mur",
                        volume: "2 x 10 / pied",
                        desc: "Assouplir pour protéger le genou.",
                        variant: "Debout sur une marche, laisse descendre le talon."
                    },
                    {
                        name: "Coussin entre les genoux",
                        volume: "3 x 20 sec",
                        desc: "Soigner l'intérieur des cuisses. Allongé, serre un coussin très fort.",
                        variant: "Mettre un ballon ou utiliser un élastique."
                    },
                    {
                        name: "Ouverture coquillage",
                        volume: "3 x 15 / côté",
                        desc: "Réveiller le fessier. Allongé sur le côté, ouvre le genou vers le plafond.",
                        variant: "Ajouter un élastique autour des genoux."
                    }
                ]
            },
            phase1: {
                sessionA: {
                    title: "Séance A",
                    subtitle: "Arrière des jambes & Poussée",
                    exercises: [
                        {
                            name: "Soulevé de terre (Haltères)",
                            volume: "4 x 10",
                            rest: "90 sec",
                            desc: "Dos droit, pousse les fesses en arrière.",
                            variant: "Avec la grande barre, ou élastique sous les pieds."
                        },
                        {
                            name: "Développé couché au sol (Haltères)",
                            volume: "3 x 10",
                            rest: "90 sec",
                            desc: "Pousse les poids vers le plafond.",
                            variant: "Pompes classiques au sol ou avec gilet lesté."
                        },
                        {
                            name: "Fentes vers l'arrière",
                            volume: "3 x 10 / jambe",
                            rest: "60 sec",
                            desc: "Un grand pas en arrière pour protéger le genou.",
                            variant: "Monter sur une chaise solide très lentement."
                        },
                        {
                            name: "Cardio : Balancier Kettlebell",
                            volume: "8 min EMOM",
                            rest: "Reste de min",
                            desc: "Mouvement de hanches, 10 à 12 fois par minute.",
                            variant: "Pont fessier au sol rapide (15 fois par minute)."
                        }
                    ]
                },
                sessionB: {
                    title: "Séance B",
                    subtitle: "Cuisses, Dos & Équilibre",
                    exercises: [
                        {
                            name: "Squat avec 1 Kettlebell",
                            volume: "4 x 10",
                            rest: "90 sec",
                            desc: "Descends bas, genoux vers l'extérieur.",
                            variant: "Squat sans poids, ou avec haltères sur les épaules."
                        },
                        {
                            name: "Tirage dos penché (Barre)",
                            volume: "4 x 10",
                            rest: "90 sec",
                            desc: "Dos droit en avant, tire vers le ventre.",
                            variant: "Tirage à un bras avec haltère appuyé sur une chaise."
                        },
                        {
                            name: "Mollets sur une marche",
                            volume: "3 x 12 / jambe",
                            rest: "60 sec",
                            desc: "Descends très bas, monte très haut.",
                            variant: "Mollets au sol sur les deux pieds en même temps."
                        },
                        {
                            name: "Marche du fermier",
                            volume: "4 x 30 sec",
                            rest: "60 sec",
                            desc: "Marche droit en serrant le ventre.",
                            variant: "Planche classique sur les coudes au sol."
                        }
                    ]
                },
                sessionC: {
                    title: "Séance C",
                    subtitle: "Poids du corps",
                    exercises: [
                        {
                            name: "Tractions",
                            volume: "4 x Max",
                            rest: "2 min",
                            desc: "Arrête-toi avant de bloquer complètement.",
                            variant: "Tirage élastique accroché en haut d'une porte."
                        },
                        {
                            name: "Pompes",
                            volume: "4 x 10-15",
                            rest: "90 sec",
                            desc: "Corps bien droit.",
                            variant: "Pompes sur les genoux ou pieds sur le canapé."
                        },
                        {
                            name: "Pont fessier à une jambe",
                            volume: "3 x 12 / jambe",
                            rest: "60 sec",
                            desc: "Allongé, lève le bassin avec un seul pied au sol.",
                            variant: "Les deux pieds au sol avec un haltère sur le ventre."
                        },
                        {
                            name: "Circuit Cardio",
                            volume: "4 Tours",
                            rest: "60 sec",
                            desc: "10 Pompes, 15 Squats, 20 Grimpeurs au sol.",
                            variant: "20 squats, 20 fentes arrière, 20 montées de genoux sur place."
                        }
                    ]
                }
            },
            phase2: {
                sessionA: {
                    title: "Séance A",
                    subtitle: "Force Jambes & Rebond",
                    exercises: [
                        {
                            name: "Squat Lourd (Barre/Haltères)",
                            volume: "4 x 6-8",
                            rest: "2 min",
                            desc: "Descends en contrôle, remonte comme une fusée.",
                            variant: "Squat avec les deux Kettlebells à la poitrine."
                        },
                        {
                            name: "Soulevé de terre lourd",
                            volume: "4 x 8",
                            rest: "90 sec",
                            desc: "Garde le dos plat, cible l'arrière des cuisses.",
                            variant: "Pont fessier avec un gros haltère sur le bassin."
                        },
                        {
                            name: "Petits rebonds sur place",
                            volume: "3 x 20 sauts",
                            rest: "60 sec",
                            desc: "Rebondis pointes de pieds, genoux tendus.",
                            variant: "Montées sur pointes de pieds très rapides sans décoller."
                        },
                        {
                            name: "Planche sur chaise",
                            volume: "3 x 30 sec",
                            rest: "60 sec",
                            desc: "Pour bétonner l'intérieur des cuisses.",
                            variant: "Allongé, serre un gros coussin très fort entre les genoux."
                        }
                    ]
                },
                sessionB: {
                    title: "Séance B",
                    subtitle: "Haut du corps & Armure",
                    exercises: [
                        {
                            name: "Développé couché lourd",
                            volume: "4 x 6-8",
                            rest: "2 min",
                            desc: "Mets lourd. Pousse avec violence.",
                            variant: "Pompes avec ton gilet lesté."
                        },
                        {
                            name: "Tirage dos penché (Barre)",
                            volume: "4 x 8",
                            rest: "2 min",
                            desc: "Tire fort vers le ventre.",
                            variant: "Tirage avec ton élastique le plus dur à la porte."
                        },
                        {
                            name: "Tractions Lestées",
                            volume: "4 x 6-8",
                            rest: "90 sec",
                            desc: "Pour construire un dos épais.",
                            variant: "Tractions sans gilet ou aide avec élastique sous le pied."
                        },
                        {
                            name: "Marche du fermier lourd",
                            volume: "4 x 40 sec",
                            rest: "60 sec",
                            desc: "Marche sans pencher sur les côtés.",
                            variant: "Marche avec UN SEUL haltère lourd (change de main)."
                        }
                    ]
                },
                sessionC: {
                    title: "Séance C",
                    subtitle: "Déplacements & Souffle",
                    exercises: [
                        {
                            name: "Fentes en avançant",
                            volume: "4 x 10 / jambe",
                            rest: "90 sec",
                            desc: "Avance pas à pas, genou arrière frôle le sol.",
                            variant: "Fentes vers l'arrière sur place (plus doux pour le genou)."
                        },
                        {
                            name: "Pompes Explosives",
                            volume: "4 x 10-12",
                            rest: "90 sec",
                            desc: "Pousse fort pour décoller un peu les mains si possible.",
                            variant: "Pompes classiques avec un élastique dans le dos."
                        },
                        {
                            name: "Balancier Kettlebell",
                            volume: "4 x 15",
                            rest: "60 sec",
                            desc: "Coup de hanches sec et rapide.",
                            variant: "Élastique accroché à un poteau, tiré entre les jambes vers l'avant."
                        },
                        {
                            name: "Pas chassés latéraux",
                            volume: "3 x 1 min",
                            rest: "60 sec",
                            desc: "Élastique aux genoux, posture basse, pas de côté.",
                            variant: "Pas de côté très lents jambes presque tendues."
                        }
                    ]
                }
            }
        };

        const weekSchedule = [
            { day: 'Lun', session: 'A', type: 'workout' },
            { day: 'Mar', session: '💤', type: 'rest' },
            { day: 'Mer', session: 'B', type: 'workout' },
            { day: 'Jeu', session: '💤', type: 'rest' },
            { day: 'Ven', session: 'C', type: 'workout' },
            { day: 'Sam', session: '🧘', type: 'rest' },
            { day: 'Dim', session: '👨‍👩‍👧', type: 'rest' }
        ];

        function App() {
            const [currentWeek, setCurrentWeek] = useState(1);
            const [currentView, setCurrentView] = useState('home');
            const [selectedSession, setSelectedSession] = useState(null);

            const currentPhase = currentWeek <= 4 ? 'phase1' : 'phase2';
            const phaseData = programData[currentPhase];

            const handleDayClick = (day) => {
                if (day.type === 'workout') {
                    setSelectedSession(`session${day.session}`);
                    setCurrentView('workout');
                }
            };

            const renderHome = () => (
                <>
                    <div className="header">
                        <div className="title">Rehaab</div>
                        <div className="week-selector">
                            {[1, 2, 3, 4, 5, 6, 7, 8].map(week => (
                                <button
                                    key={week}
                                    className={`week-btn ${currentWeek === week ? 'active' : ''}`}
                                    onClick={() => setCurrentWeek(week)}
                                >
                                    S{week}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="phase-info">
                        <div className="phase-badge">
                            {currentPhase === 'phase1' ? 'Phase 1 : Recherche & Réparation' : 'Phase 2 : Force & Vitesse'}
                        </div>
                        {currentPhase === 'phase1' ? 
                            'Éteindre les douleurs à la hanche, réparer l\'intérieur des cuisses, solidifier les chevilles. Tempo : 3-1-1-0.' :
                            'Créer une armure, soulever plus lourd, réapprendre à rebondir. Tempo : 2 sec descente, remonte explosif.'
                        }
                    </div>

                    <div className="calendar">
                        {weekSchedule.map((day, idx) => (
                            <div
                                key={idx}
                                className={`day-card ${day.type} ${currentView === 'workout' && selectedSession === `session${day.session}` ? 'active' : ''}`}
                                onClick={() => handleDayClick(day)}
                            >
                                <div className="day-label">{day.day}</div>
                                <div className="day-session">{day.session}</div>
                            </div>
                        ))}
                    </div>
                </>
            );

            const renderWorkout = () => {
                const session = phaseData[selectedSession];
                const needsWarmup = selectedSession !== 'sessionRest';

                return (
                    <div className="workout-view">
                        <div className="workout-header">
                            <div className="workout-title">{session.title}</div>
                            <div className="workout-subtitle">{session.subtitle}</div>
                        </div>

                        {needsWarmup && (
                            <div className="section">
                                <div className="section-title">🔥 Échauffement (Obligatoire)</div>
                                {programData.warmup.exercises.map((ex, idx) => (
                                    <div key={idx} className="exercise-card">
                                        <div className="exercise-header">
                                            <div className="exercise-name">{ex.name}</div>
                                            <div className="exercise-volume">{ex.volume}</div>
                                        </div>
                                        <div className="exercise-desc">{ex.desc}</div>
                                        {ex.variant && (
                                            <div className="exercise-variant">
                                                <div className="variant-label">Variante</div>
                                                {ex.variant}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}

                        <div className="section">
                            <div className="section-title">💪 Exercices Principaux</div>
                            {session.exercises.map((ex, idx) => (
                                <div key={idx} className="exercise-card">
                                    <div className="exercise-header">
                                        <div className="exercise-name">{ex.name}</div>
                                        <div className="exercise-volume">{ex.volume}</div>
                                    </div>
                                    <div className="exercise-desc">
                                        {ex.desc}
                                        {ex.rest && ` • Repos : ${ex.rest}`}
                                    </div>
                                    {ex.variant && (
                                        <div className="exercise-variant">
                                            <div className="variant-label">Variante</div>
                                            {ex.variant}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>

                        <button className="back-btn" onClick={() => setCurrentView('home')}>
                            ← Retour
                        </button>
                    </div>
                );
            };

            return (
                <div className="app">
                    {currentView === 'home' ? renderHome() : renderWorkout()}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
