<style>
:root{--bg:#080908;--card:#111311;--card2:#191c19;--border:#2a2e2a;--text:#f4f5f0;--muted:#737973;--sub:#a7aca7;--accent:#d7f43b;--red:#ff5a50;--green:#49d67d;--orange:#f2a53a;--radius:12px;--radius-sm:8px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,a{touch-action:manipulation}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{width:100%;max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);padding-bottom:calc(7rem + env(safe-area-inset-bottom,0px))}
.skip-link{position:fixed;top:.5rem;left:.5rem;z-index:200;transform:translateY(-160%);background:var(--accent);color:#080908;padding:.7rem 1rem;text-decoration:none;font-weight:700;border-radius:6px}
.skip-link:focus{transform:translateY(0)}

.title{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;letter-spacing:-1px;line-height:1}
.title span{color:var(--accent)}

.section{padding:1.5rem 1.25rem 0}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.check{width:32px;height:32px;flex-shrink:0;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .25s;font-size:1rem}

.spark{width:100%;height:90px;margin-top:.5rem}

@media (max-width:360px){
  .title{font-size:1.9rem}
  .section{padding-left:1rem;padding-right:1rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<link rel="stylesheet" href="personal.css">

<script>
// Doit rester égale au nom de cache de sw.js (vérifié par les tests) : c'est elle qu'on compare entre téléphone et ordi dans Profil.
window.REHAAB_VERSION='v38-refonte';
if('serviceWorker' in navigator){window.addEventListener('load',function(){
  // Une app installée sur l'écran d'accueil ne se recharge presque jamais : on cherche une nouvelle version à chaque retour au premier plan.
  // Jamais de rechargement en pleine séance : la nouvelle version s'applique à la prochaine ouverture.
  var reloaded=false,hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(!hadController||reloaded||location.hash.indexOf('#session')===0)return;reloaded=true;window.location.reload();});
  navigator.serviceWorker.register('sw.js').then(function(reg){
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')reg.update().catch(function(){});});
  }).catch(function(){});
});}
</script>
<!-- Rehaab v2 — 14 semaines -->
</body>
